<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oman eVisa Header Example</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* የከላይኛው ሰማያዊ አሞሌ (Top Blue Bar) */
        .top-bar {
            background-color: #4b6baf;
            padding: 6px 15px;
            display: flex;
            justify-content: flex-start;
        }

        .lang-btn {
            background-color: #e8ecef;
            color: #2b4170;
            border: none;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 2px;
            cursor: pointer;
        }

        /* ኸደር (Header Section) */
        .header {
            background-color: #ffffff;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            position: relative;
        }

        /* በግራ በኩል ያለው ሎጎ (Royal Oman Police) */
        .left-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ከእውነተኛው የROP ኤምብሌም ጋር የሚመሳሰል SVG ሎጎ */
        .police-badge {
            width: 32px;
            height: 32px;
        }

        .logo-text-left {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .arabic-police {
            font-size: 13px;
            color: #2b4170;
            font-weight: bold;
            direction: rtl;
        }

        .english-police {
            font-size: 8px;
            color: #4b6baf;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* በቀኝ በኩል ያለው ሎጎ (Oman eVisa + Menu) */
        .right-logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .evisa-logo {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            line-height: 1;
        }

        .oman-text {
            font-size: 28px;
            font-weight: 800;
            color: #2b1c4d; /* ጠቆር ያለ ሐምራዊ/ሰማያዊ ከለር */
            letter-spacing: -0.5px;
        }

        .oman-text span {
            color: #2b1c4d;
        }

        .arabic-evisa {
            font-size: 12px;
            color: #2b1c4d;
            font-weight: bold;
            direction: rtl;
            margin-top: -2px;
        }

        /* የሜኑ ቁልፍ (Hamburger Button) */
        .top-menu-btn {
            background-color: #4b6baf;
            border: none;
            border-radius: 4px;
            padding: 7px 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .top-menu-btn span {
            display: block;
            width: 18px;
            height: 3px;
            background-color: white;
            border-radius: 1px;
        }
    </style>
</head>
<body>

    <!-- 1. የላይኛው ሰማያዊ አሞሌ -->
    <div class="top-bar">
        <button class="lang-btn">العربية</button>
    </div>

    <!-- 2. በምስሉ ላይ ያለው ኸደር (Header) -->
    <div class="header">
        
        <!-- በግራ በኩል ያለው የROP ሎጎ -->
        <div class="left-logo">
            <svg class="police-badge" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#1b365d" />
                <path d="M50 15 L60 35 L82 35 L64 48 L71 70 L50 56 L29 70 L36 48 L18 35 L40 35 Z" fill="#d4af37" />
                <circle cx="50" cy="50" r="12" fill="#c0392b" />
            </svg>
            <div class="logo-text-left">
                <span class="arabic-police">شرطةعُمان السلطانية</span>
                <span class="english-police">ROYAL OMAN POLICE</span>
            </div>
        </div>

        <!-- በቀኝ በኩል ያለው የOman eVisa ሎጎ እና የሜኑ ቁልፍ -->
        <div class="right-logo-container">
            <div class="evisa-logo">
                <div class="oman-text">Oman<span>e</span></div>
                <div class="arabic-evisa">ከሩኒየ ኦማኒያ</div>
            </div>

            <!-- የሜኑ ቁልፍ -->
            <button class="top-menu-btn" id="topMenuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

    </div>

</body>
</html>
